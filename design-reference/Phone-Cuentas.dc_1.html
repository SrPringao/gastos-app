<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ExpenseBro · Métodos de pago iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#050506;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#F5F5F7}
a{color:#8C95FF;text-decoration:none}a:hover{color:#B3B9FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1220px; position: relative; overflow: hidden; background: radial-gradient(90% 30% at 30% -4%, rgba(94,107,255,0.16), rgba(94,107,255,0) 70%), #050506">
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none"><filter id="grainPC"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grainPC)"/></svg>
<div style="position: relative; box-sizing: border-box; padding: 54px 16px 140px; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; margin-bottom: -8px">
<a href="Phone-Menu.dc.html" aria-label="Abrir menú" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.06), 0 6px 16px -8px rgba(0,0,0,0.8); color: #F5F5F7; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></a>
<button aria-label="Nuevo método" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.08); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 0 0 1px rgba(255,255,255,0.06), 0 6px 16px -8px rgba(0,0,0,0.8); color: #8C95FF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<header style="display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 600; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.04em">Métodos de pago</div>
<h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em">Cuentas</h1>
</div>
</header>

<div style="position: relative; height: 636px">
<sc-for list="{{stack}}" as="c" hint-placeholder-count="9">
<a href="{{c.href}}" aria-label="{{c.name}}" style="position: absolute; left: 0; right: 0; top: {{c.top}}; height: 220px; border-radius: 18px; padding: 15px 18px; box-sizing: border-box; color: #fff; display: flex; flex-direction: column; justify-content: space-between; {{c.bg}}">
<div style="display: flex; justify-content: space-between; align-items: center; height: 22px">
<span style="font-size: 16px; font-weight: 700">{{c.name}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.8)">
<sc-if value="{{c.linked}}" hint-placeholder-val="{{ false }}"><span style="width: 22px; height: 22px; border-radius: 11px; background: rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></span></sc-if>
{{c.type}}</span>
</div>
<sc-if value="{{c.front}}" hint-placeholder-val="{{ false }}">
<span style="width: 40px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #E9EAEE, #A8ABB5); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15)"></span>
</sc-if>
<sc-if value="{{c.front}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: rgba(255,255,255,0.78)">Pago día 2 · Más usada</span><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">13 gastos en octubre</span></div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
</div>
</sc-if>
</a>
</sc-for>
</div>
<div style="font-size: 13px; color: #8E8E93; text-align: center; margin-top: -6px">Toca una tarjeta para ver y editar sus ajustes</div>

<section style="display: flex; flex-direction: column; gap: 6px">
<div style="background: linear-gradient(180deg, #202024 0%, #17171A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.05), 0 24px 48px -24px rgba(0,0,0,0.9); border-radius: 18px; overflow: hidden">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 60px; color: #F5F5F7">
<div style="width: 30px; height: 30px; flex: none; border-radius: 8px; background: linear-gradient(135deg, #FF6B8B 0%, #A35BFF 55%, #4F7BFF 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px">Atajo de Apple Pay</span><span style="font-size: 13px; color: #8E8E93">2 de 9 métodos vinculados</span></div>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
</a>
</div>
<div style="padding: 4px 16px 0; font-size: 13px; color: #8E8E93; line-height: 1.4">Los saldos de cada cuenta viven en Patrimonio.</div>
</section>
</div>

<nav aria-label="Pestañas" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 10px 0; background: rgba(22,22,24,0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start">
<a href="Phone-Inicio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #8E8E93; min-height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Inicio</a>
<a href="Phone-Gastos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #8E8E93; min-height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Gastos</a>
<div style="display: flex; justify-content: center"><button aria-label="Nuevo gasto" style="width: 52px; height: 52px; margin-top: -14px; border-radius: 26px; border: 0; background: linear-gradient(180deg, {{accentLight}}, {{accent}}); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 24px -6px {{accentGlow}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: {{accent}}; min-height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>Cuentas</a>
<a href="Phone-Patrimonio.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: #8E8E93; min-height: 44px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Patrimonio</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5E6BFF","options":["#5E6BFF","#0A84FF","#30D158","#FF9F0A"]},"$preview":{"width":390,"height":1220}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#5E6BFF';
const h = accent.replace('#', '');
const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
const mix = (c) => Math.round(c + (255 - c) * 0.32);
const list = [
['Openbank Crédito', '#C8323C', '#6E1219', 'Crédito'],
['Banregio', '#F08A24', '#9A4A0C', 'Crédito'],
['Plata', '#E0573A', '#7A1F12', 'Crédito'],
['Openbank Débito', '#13969C', '#0A5559', 'Débito'],
['Revolut Débito', '#3E44C9', '#1E2170', 'Débito'],
['Nu Débito', '#8E55F0', '#5B22C4', 'Débito', true],
['Efectivo', '#2E7A45', '#173F24', 'Efectivo'],
['Nu Crédito', '#6B3FC4', '#3A1C7A', 'Crédito', true],
['Revolut Crédito', '#5A5A63', '#26262B', 'Crédito', false, 'Phone-Cuenta-Detalle.dc.html']
];
const stack = list.map((x, i) => {
const front = i === list.length - 1;
return {
name: x[0], type: x[3], linked: !!x[4], front,
href: x[5] || '#',
top: (i * 52) + 'px',
bg: 'background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.2), rgba(255,255,255,0) 55%), linear-gradient(145deg, ' + x[1] + ' 0%, ' + x[2] + ' 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 0 1px rgba(255,255,255,0.1), 0 -6px 16px rgba(0,0,0,0.45)' + (front ? ', 0 24px 40px -20px ' + x[2] : '')
};
});
return { accent, accentLight: 'rgb(' + mix(r) + ',' + mix(g) + ',' + mix(b) + ')', accentGlow: 'rgba(' + r + ',' + g + ',' + b + ',0.45)', stack };
}
}
</script>
</body>
</html>
