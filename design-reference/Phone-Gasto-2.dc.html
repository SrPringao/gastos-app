<div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 8px 0">
<button style="justify-self: start; border: 0; background: transparent; padding: 12px 6px; font-size: 17px; color: #8C95FF; display: flex; align-items: center; gap: 2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Atrás</button>
<span style="font-size: 17px; font-weight: 600">¿Cómo pagaste?</span>
<span></span>
</div>

<span style="width: 28px; height: 4px; border-radius: 2px; background: #5E6BFF; box-shadow: 0 0 8px rgba(94,107,255,0.6)"></span>
<span style="width: 28px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14)"></span>
</div>

<div style="padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: baseline; justify-content: center; gap: 8px">
<span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">$185.00</span>
<span style="font-size: 15px; color: #8E8E93">· Tacos con Pily</span>
</div>

<section style="display: flex; flex-direction: column; gap: 8px">

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="position: relative; aspect-ratio: 1.45; border: 0; border-radius: 14px; padding: 10px; box-sizing: border-box; text-align: left; color: #fff; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.2), rgba(255,255,255,0) 55%), linear-gradient(145deg, #5A5A63 0%, #26262B 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 0 1px rgba(255,255,255,0.1), 0 0 0 2px #111113, 0 0 0 4px #5E6BFF">

<span style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: rgba(255,255,255,0.8)">13 en oct<span style="width: 18px; height: 18px; border-radius: 9px; background: #5E6BFF; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span></span>
</button>
<button aria-pressed="false" style="position: relative; aspect-ratio: 1.45; border: 0; border-radius: 14px; padding: 10px; box-sizing: border-box; text-align: left; color: #fff; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.16), rgba(255,255,255,0) 55%), linear-gradient(145deg, #2E7A45 0%, #173F24 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), inset 0 0 0 1px rgba(255,255,255,0.08)">
<span style="font-size: 12px; font-weight: 700">Efectivo</span>
<span style="font-size: 10px; color: rgba(255,255,255,0.8)">2 en oct</span>
</button>
<button aria-pressed="false" style="position: relative; aspect-ratio: 1.45; border: 0; border-radius: 14px; padding: 10px; box-sizing: border-box; text-align: left; color: #fff; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%), linear-gradient(145deg, #6B3FC4 0%, #3A1C7A 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 0 1px rgba(255,255,255,0.1)">

<section style="display: flex; flex-direction: column; gap: 6px">

<div style="border-radius: 14px; background: #1C1C1F; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06); overflow: hidden">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="6">
<button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; border: 0; background: transparent; color: #F5F5F7; text-align: left">
<span style="width: 38px; height: 25px; flex: none; border-radius: 5px; position: relative; {{m.bg}}"><span style="position: absolute; left: 5px; top: 8px; width: 8px; height: 6px; border-radius: 2px; background: {{m.chip}}"></span></span>
<span style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 8px; {{m.sep}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px">{{m.name}}</span><span style="font-size: 12px; color: #8E8E93">{{m.type}}</span></span>
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#636366" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
</span>
</button>
</sc-for>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const GOLD = 'linear-gradient(135deg, #F3E1A6, #C9A55A)', SILVER = 'linear-gradient(135deg, #E9EAEE, #A8ABB5)';
const bg = (a, z) => 'background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,0.22), rgba(255,255,255,0) 55%), linear-gradient(145deg, ' + a + ' 0%, ' + z + ' 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 0 1px rgba(255,255,255,0.1)';
const methods = [
{ name: 'Plata', type: 'Crédito', bg: bg('#E0573A', '#7A1F12'), chip: SILVER },
{ name: 'Banregio', type: 'Crédito', bg: bg('#F08A24', '#9A4A0C'), chip: GOLD },
{ name: 'Openbank Crédito', type: 'Crédito', bg: bg('#C8323C', '#6E1219'), chip: GOLD },
{ name: 'Nu Débito', type: 'Débito', bg: bg('#8E55F0', '#5B22C4'), chip: GOLD },
{ name: 'Revolut Débito', type: 'Débito', bg: bg('#3E44C9', '#1E2170'), chip: SILVER },
{ name: 'Openbank Débito', type: 'Débito', bg: bg('#13969C', '#0A5559'), chip: GOLD }
];
methods.forEach((m, i) => { m.sep = i < methods.length - 1 ? 'border-bottom: 1px solid rgba(255,255,255,0.06)' : ''; });
return { methods };
}
}
</script>
</body>
